<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Kémia Labor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23160f3a%22/><text y=%22.9em%22 x=%2212%22 font-size=%2276%22>🧪</text></svg>">
<style>
:root{--bg:#0d0b1f;--card:#1a1638;--card2:#241e4d;--line:#352c6b;--tx:#f3f1ff;--mut:#a59fd0;
--cy:#22e3ff;--mg:#ff3df0;--lime:#9dff3d;--yel:#ffd23d;--red:#ff4d6d;--grn:#35e08a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(900px 500px at 80% -10%,#3a1470 0,transparent 60%),radial-gradient(700px 500px at -10% 110%,#0b3a66 0,transparent 60%),var(--bg);background-attachment:fixed}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:14px 16px 96px;position:relative}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;user-select:none;-webkit-user-select:none}
.btn{display:block;width:100%;padding:15px 18px;border-radius:16px;font-weight:800;font-size:17px;letter-spacing:.3px;background:var(--cy);color:#06222b;box-shadow:0 5px 0 #0b93a8;transition:transform .06s,box-shadow .06s;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0b93a8}
.btn.mg{background:var(--mg);color:#2b0429;box-shadow:0 5px 0 #a3189a}.btn.mg:active{box-shadow:0 1px 0 #a3189a}
.btn.lime{background:var(--lime);color:#14290a;box-shadow:0 5px 0 #5aa81a}.btn.lime:active{box-shadow:0 1px 0 #5aa81a}
.btn.yel{background:var(--yel);color:#2e2300;box-shadow:0 5px 0 #b38d10}.btn.yel:active{box-shadow:0 1px 0 #b38d10}
.btn.ghost{background:var(--card2);color:var(--tx);box-shadow:0 5px 0 #120e2c}.btn.ghost:active{box-shadow:0 1px 0 #120e2c}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn small{display:block;font-weight:600;font-size:12.5px;opacity:.75;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.mut{color:var(--mut)}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.gap>*+*{margin-top:12px}
/* header */
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ava{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--mg),var(--cy));display:grid;place-items:center;font-size:28px;flex:none}
.hdr .nm{font-weight:900;font-size:18px;line-height:1.1}
.rank{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--yel);text-transform:uppercase}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;white-space:nowrap}
.bar{height:12px;background:#0a0820;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cy));border-radius:99px;transition:width .4s}
/* path */
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding:22px 0 10px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;padding:0}
.node .orb{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:var(--c);box-shadow:0 7px 0 rgba(0,0,0,.45),0 0 26px -4px var(--c);border:4px solid rgba(255,255,255,.25);transition:transform .08s}
.node:active .orb{transform:translateY(5px)}
.node.lock .orb{background:#2a2550;box-shadow:0 7px 0 #15122d;filter:grayscale(1);opacity:.7}
.node.cur .orb{animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.node .lb{font-weight:800;font-size:14px;max-width:170px;text-align:center}
.stars{font-size:15px;letter-spacing:2px}.stars .off{opacity:.22;filter:grayscale(1)}
.boss .orb{width:108px;height:108px;font-size:50px;border-radius:28px;background:linear-gradient(135deg,#ffd23d,#ff7a3d);--c:#ffb03d}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,11,31,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}
.nav>div{max-width:560px;margin:0 auto;display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:800;color:var(--mut)}
.nav button b{display:block;font-size:23px;font-weight:400}
.nav button.on{color:var(--cy);background:var(--card)}
/* zone sheet */
.back{background:var(--card2);border-radius:12px;padding:9px 13px;font-weight:800}
.rap{background:linear-gradient(135deg,#2a0f4f,#0f2a4f);border:1px solid var(--mg);border-radius:18px;padding:14px 16px;font-style:italic;font-weight:700;line-height:1.55}
.rap:before{content:"🎤 RAP-SOR";display:block;font-style:normal;font-size:11px;letter-spacing:2px;color:var(--mg);margin-bottom:4px}
/* reel cards */
.reel{position:fixed;inset:0;background:#07061a;z-index:20;display:flex;flex-direction:column}
.reel .dots{display:flex;gap:4px;padding:12px 14px 6px}.reel .dots i{flex:1;height:4px;border-radius:9px;background:#3a3470}.reel .dots i.on{background:#fff}
.reel .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 26px;max-width:560px;margin:0 auto;width:100%}
.reel .em{font-size:70px;margin-bottom:8px}
.reel h2{font-size:28px;font-weight:900;margin-bottom:14px;line-height:1.15}
.reel .tx{font-size:19px;line-height:1.55}
.reel .tx b{color:var(--cy)}.y{color:var(--yel);font-weight:900;font-style:normal;background:rgba(255,210,61,.13);padding:0 5px;border-radius:6px}
.reel .tx li{margin:6px 0}.reel .tx ul{padding-left:20px;margin:6px 0}
.reel .ft{padding:12px 18px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;width:100%;display:flex;gap:10px}
/* lesson */
.ltop{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.x{background:none;font-size:22px;color:var(--mut);padding:4px 6px}
.hearts{font-size:17px;white-space:nowrap}.combo{font-weight:900;color:var(--yel);font-size:14px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:1.5px;color:var(--mg);text-transform:uppercase;margin-bottom:6px}
.qt{font-size:22px;font-weight:800;line-height:1.3;margin-bottom:18px}
.opts{display:grid;gap:11px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:15px 16px;font-size:17px;font-weight:700;text-align:left;box-shadow:0 4px 0 #120e2c}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #120e2c}
.opt.ok{border-color:var(--grn);background:#10392a}.opt.no{border-color:var(--red);background:#42142a}
.opt.sel{border-color:var(--cy);background:#0f3346}.opt.gone{opacity:.25;pointer-events:none}
.opt .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--lime);color:#14290a;font-size:14px;margin-right:8px}
.inp{width:100%;background:#0a0820;border:2px solid var(--line);border-radius:16px;padding:15px 16px;font:inherit;font-size:19px;font-weight:700;color:var(--tx);outline:none;margin-bottom:10px}
.inp:focus{border-color:var(--cy)}.inp.ok{border-color:var(--grn)}.inp.no{border-color:var(--red)}
.hint{background:none;color:var(--yel);font-weight:800;padding:8px 0;font-size:15px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pairs .opt{font-size:15px;padding:13px 10px;text-align:center}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .18s}
.fb>div{max-width:528px;margin:0 auto}
.fb.ok{background:#0f3a2a;border-top:3px solid var(--grn)}.fb.no{background:#451329;border-top:3px solid var(--red)}
.fb h3{font-size:19px;margin-bottom:4px}.fb p{margin:0 0 12px;font-size:16px;line-height:1.4}
@keyframes up{from{transform:translateY(100%)}}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* result */
.big{font-size:74px;text-align:center;line-height:1.1}
.ctr{text-align:center}
.grade{font-size:92px;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--yel),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.loot{display:flex;align-items:center;gap:14px;border-radius:18px;padding:13px 14px;background:var(--card);border:2px solid var(--r)}
.loot .ic{font-size:40px;width:62px;height:62px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--r) 22%,#0a0820);flex:none}
.loot .rr{font-size:11px;font-weight:900;letter-spacing:1.5px;color:var(--r)}
.loot.lock{--r:#3a3470;opacity:.55}
.rev{border-left:4px solid var(--red);padding:8px 12px;background:var(--card);border-radius:0 12px 12px 0;font-size:15px;line-height:1.45}
.rev.ok{border-color:var(--grn)}
.rev b{color:var(--lime)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#fx i{position:absolute;top:-30px;font-style:normal;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="fx"></div>
<script>
"use strict";
/* ============ TANANYAG ============ */
/* Forrás: 7. o. kémia tankönyv 2.1 (22-23. o.), 2.2 (24-25. o.) + munkafüzet: A kockacukor vizsgálata (feladatlap) */
const Z=[
{id:'z1',n:'Fizikai tulajdonságok',e:'🍬',c:'#ff9a3d',loot:['🥽','Neon védőszemüveg'],
 rap:['Szín, szag, halmazállapot, ez a fizikai start,','keménység, oldhatóság: mind a listán, rajt!','Olvadáspont, sűrűség: mérhető a rész,','száznyolcvanhat fok a cukornak a mérés!'],
 cards:[
 {e:'🔎',t:'Hogyan vizsgálunk egy anyagot?',b:'Megfigyeljük a <b>színét, szagát, halmazállapotát</b>.<br><br>A többit <b>kísérlettel</b> derítjük fel: milyen oldószerben oldódik, mekkora az <b>olvadáspontja</b>, <b>forráspontja</b>, <b>sűrűsége</b>, vezeti-e az elektromos áramot.<br><br>A példa: a közismert <b>répacukor</b>.'},
 {e:'🍬',t:'A répacukor',b:'A cukrot hazánkban <b>cukorrépából</b>, a trópusi területeken <b>cukornádból</b> nyerik.<br><br>A répacukor és a nádcukor kémiai szempontból <b>azonos vegyület</b>.<br><br>Képlete: <b>C₁₂H₂₂O₁₁</b>'},
 {e:'📋',t:'Fizikai tulajdonságai',b:'<ul><li>színe: <b>fehér</b></li><li>szaga: <b>szagtalan</b></li><li>halmazállapota: <b>szilárd</b></li><li>oldhatósága: <b>vízben jó</b></li><li>keménysége: <b>viszonylag puha</b></li><li>törhető, aprítható</li></ul>'},
 {e:'🌡️',t:'Mérhető tulajdonságok',b:'Egyes fizikai tulajdonságok <b>mérhetők</b>: számadattal és mértékegységgel jellemzik az anyagot.<br><br>Olvadáspont: <i class=y>186 °C</i><br>Sűrűség: <i class=y>1,59 g/cm³</i> → <b>lesüllyed a víz aljára</b> (a víznél nagyobb a sűrűsége)'},
 {e:'🧱',t:'Mi a fizikai tulajdonság?',b:'Az anyag <b>színét, szagát, halmazállapotát, keménységét</b> és <b>oldódásának mértékét</b> az anyag <b>fizikai tulajdonságai</b> közé soroljuk.<br><br>Csak a nagyon sok részecskéből álló <b>anyagi halmazra</b> jellemzők, egyetlen molekulára nem.'}],
 pairs:[['szín','fehér'],['szag','szagtalan'],['halmazállapot','szilárd'],['oldhatóság','vízben jó'],['olvadáspont','186 °C'],['sűrűség','1,59 g/cm³']]},

{id:'z2',n:'Kémiai tulajdonságok',e:'🔥',c:'#ff4d6d',loot:['🔥','Bunsen-égő Turbo'],
 rap:['Hevítsd a cukrot: sárgul, barnul, karamell,','kémiai tulajdonság: új anyag lesz, ez kell!','Hamuval meggyújtod: ég, nem áll meg,','szén-dioxid és víz a termék, és kész.'],
 cards:[
 {e:'🥄',t:'A cukor a kémcsőben',b:'A cukor hevítésekor <b>olvadás közben sárgul, barnul</b>, a kémcsőből <b>kellemes illatú gázok</b> távoznak.<br><br>Hevítés hatására <b>új anyagokká</b> alakul, amelyek tulajdonságai a kiindulási anyagtól eltérőek. A fő termék a sokféle összetevőből álló <b>karamell</b>.'},
 {e:'🕯️',t:'A cukor égése',b:'Lángba tartva a répacukor <b>nem gyullad meg</b>. <b>Hamuban megforgatva</b> azonban <b>elégethető</b>.<br><br>Ekkor <b>szén-dioxid-gáz</b> és <b>vízgőz</b> keletkezik.'},
 {e:'👻',t:'Láthatatlan termékek',b:'Az égéstermékek <b>színtelenek és szagtalanok</b>, ezért nem látjuk őket. Csak további kísérletekkel bizonyosodhatunk meg róluk.<br><br>A <b>vízpára megjelenése a hideg üvegen</b> <b>vízgőz</b> keletkezésére utal.'},
 {e:'📖',t:'Mi a kémiai tulajdonság?',b:'Az anyag azon tulajdonságait, amelyek megmutatják, hogy <b>milyen körülmények között</b> alakul át, és <b>közben milyen anyag keletkezik</b>, <b>kémiai tulajdonságoknak</b> nevezzük.'},
 {e:'🍬',t:'A cukor 2 kémiai tulajdonsága',b:'<ol><li><b>Melegítés hatására bomlik</b>: sokféle vegyületet tartalmazó <b>karamell</b> alakul, erős hevítésre <b>elszenesedik</b>.</li><li><b>Hamuval bevonva meggyújtható</b>: a levegő <b>oxigénjével</b> lép reakcióba, és <b>szén-dioxiddá</b>, illetve <b>vízzé</b> ég el.</li></ol>'}],
 pairs:[['hevítés hatására','bomlik, karamell lesz'],['hamuban megforgatva','meggyullad'],['a cukor égéstermékei','szén-dioxid és víz'],['erős hevítés után marad','szén'],['hideg üvegen megjelenik','vízgőz'],['az égéshez kell','oxigén']]},

{id:'z3',n:'Fizikai és kémiai változások',e:'🔄',c:'#22e3ff',loot:['🧤','Laborkesztyű Pro'],
 rap:['Aprítod, oldod, olvasztod: fizikai,','új anyag nincs, a cukor marad ugyanaz, na!','Ha új anyag jön, az kémiai, reakció a név,','a részecske is változik – ez a lényeg, érzed?'],
 cards:[
 {e:'🔨',t:'Fizikai változás',b:'A répacukor <b>aprítás</b>, vízben való <b>oldás</b> vagy <b>enyhe olvasztás</b> során nem alakul át más anyaggá, <b>répacukor marad</b>.<br><br>Az ilyen változások a <b>fizikai változások</b>: <b>nem keletkezik új anyag</b>.'},
 {e:'🧊',t:'Példák',b:'A legismertebb fizikai változások:<ul><li><b>halmazállapot-változások</b></li><li><b>oldódási folyamatok</b></li></ul>Csak az <b>anyagi halmaz</b> szerkezetében történik változás, a <b>részecske</b> szerkezetében nem.'},
 {e:'💥',t:'Kémiai változás',b:'Erősebb hevítés vagy égetés során nemcsak a halmaz szerkezete, hanem a <b>molekulák szerkezete</b> is megváltozik.<br><br>A cukrot alkotó <b>atomok más molekulákká kapcsolódnak össze</b>, így <b>új anyagok</b> keletkeznek.'},
 {e:'⚗️',t:'Reakció',b:'Azokat a változásokat, amelyek során <b>új anyag keletkezik</b>, <b>kémiai változásoknak</b> nevezzük.<br><br>A kémiai változásokat egyszerűen csak <b>reakcióknak</b> hívjuk.'},
 {e:'⚖️',t:'Összehasonlítás',b:'<table><tr><th></th><th>fizikai</th><th>kémiai</th></tr><tr><td>új anyag?</td><td><b>nem</b></td><td><b>igen</b></td></tr><tr><td>halmaz szerkezete</td><td>változik</td><td>változik</td></tr><tr><td>részecske szerkezete</td><td><b>nem</b> változik</td><td><b>változik</b></td></tr></table>'}],
 pairs:[['fizikai változás','nem keletkezik új anyag'],['kémiai változás','új anyag keletkezik'],['reakció','a kémiai változás másik neve'],['halmazállapot-változás','pl. olvadás'],['cukor égése','kémiai változás példája']]},

{id:'z4',n:'Magnézium és hipermangán',e:'⚖️',c:'#b07cff',loot:['🧥','Laborköpeny Limited'],
 rap:['Magnézium ezüst, jó fém, hajlik, nem oldódik,','hat-ötven az olvadás, egy-hetvennégy a sűrűség a kódja.','Hipermangán lilás, vízben lila lesz,','kettő-hetvenegy a súly, hevítve bomlik – ez a teszt!'],
 cards:[
 {e:'🪙',t:'A magnézium',b:'A magnézium (vegyjele: <b>Mg</b>) <b>ezüstszürke</b>, szagtalan, szilárd, vízben <b>nem oldódó</b>, a víznél nagyobb sűrűségű <b>fém</b>.<br><br>Jó hajlíthatósága, megmunkálhatósága és elektromos vezetése a <b>fémek jellemző tulajdonságait</b> mutatja.'},
 {e:'🟣',t:'A hipermangán',b:'Tudományos neve: <b>kálium-permanganát</b>, képlete: <b>KMnO₄</b>.<br><br><b>Lilásszürke</b>, szagtalan, szilárd vegyület, vízben <b>lila</b> színnel oldódik. Sűrűsége nagyobb a vízénél, kristályai lesüllyednek.<br>Dörzsmozsárban könnyen porítható, törik, az elektromos áramot <b>nem vezeti</b>.'},
 {e:'📊',t:'Az összehasonlító táblázat',b:'<table style="font-size:14px"><tr><th></th><th>Mg</th><th>KMnO₄</th></tr><tr><td>színe</td><td>ezüstszürke</td><td>lilásszürke</td></tr><tr><td>szaga</td><td>szagtalan</td><td>szagtalan</td></tr><tr><td>halmazáll.</td><td>szilárd</td><td>szilárd</td></tr><tr><td>olvadás-, forráspont</td><td>650 °C, 1107 °C</td><td>hevítésre bomlik</td></tr><tr><td>vízben</td><td>nem oldódik</td><td>oldódik</td></tr><tr><td>sűrűség</td><td>1,74 g/cm³</td><td>2,71 g/cm³</td></tr><tr><td>megmunkálható</td><td>jó</td><td>rossz</td></tr></table>'},

function tone(seq){if(!S.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'triangle';o.frequency.value=f;g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
const sOk=()=>tone([[660,.1],[880,.16]]),sNo=()=>{tone([[190,.22,'sawtooth']]);if(navigator.vibrate)navigator.vibrate(120)},sWin=()=>tone([[523,.12],[659,.12],[784,.12],[1047,.3]]);
function confetti(n){const fx=document.getElementById('fx'),em=['🎉','⭐','👟','🔥','💎','👑','⚡'];for(let i=0;i<(n||36);i++){const e=document.createElement('i');e.textContent=em[i%em.length];e.style.left=Math.random()*100+'%';e.style.fontSize=16+Math.random()*22+'px';e.style.animationDuration=1.6+Math.random()*1.8+'s';e.style.animationDelay=Math.random()*.6+'s';fx.appendChild(e);setTimeout(()=>e.remove(),4500)}}

/* ============ VÁLASZ-ELLENŐRZÉS ============ */
function norm(s){return String(s).replace(/[₀-₉]/g,c=>c.charCodeAt(0)-8320).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().replace(/^(az|a|grof) /,'')}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[];for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function mStr(inp,cands,strict){const n=norm(inp);if(!n)return 'no';const cs=cands.map(norm);if(cs.includes(n))return 'ok';if(strict)return 'no';for(const c of cs){if(/\d/.test(c)||c.length<4)continue;if(lev(n,c)<=(c.length>=8?2:1))return 'typo'}return 'no'}
function mNums(inp,nums){let s=norm(inp).replace(/\b(g|cm|cm3|c|fok|celsius|foknal|foktol|grad)\b/g,' ');let a=(s.match(/\d+/g)||[]).map(Number);return a.length===nums.length&&a.every((x,i)=>x===nums[i])?'ok':'no'}
function check(f,inp){return f.nums?mNums(inp,f.nums):mStr(inp,[f.a].concat(f.alt||[]),f.strict)}
function checkList(f,inps){const used={},res=[];inps.forEach(v=>{let hit=-1;f.list.forEach((it,k)=>{if(hit<0&&!used[k]&&mStr(v,[it].concat((f.lalt||{})[k]||[]))!=='no')hit=k});if(hit>=0)used[hit]=1;res.push(hit)});return res}
function stat(id,ok){const s=S.stats[id]||(S.stats[id]={o:0,b:0});ok?s.o++:s.b++}

 const b=(n,cls,em,t,sub)=>`<button class="btn ${cls}" ${st<n-1?'disabled':''} onclick="startRound('${id}',${n})">${em} ${t} ${st>=n?'✅':''}<small>${st<n-1?'🔒 előbb az előző szint':sub}</small></button>`;

function locker(){app.innerHTML=header()+`<h2 style="margin:10px 0 4px;font-weight:900">👟 Szekrény</h2><p class="mut" style="margin:0 0 14px">Minden pálya ad egy cuccot. Több csillag = ritkább változat.</p><div class="gap">${Z.map(z=>{const st=S.stars[z.id]||0;return `<div class="loot ${st?'':'lock'}" style="--r:${st?RAR[st][1]:''}"><div class="ic">${st?z.loot[0]:'❔'}</div><div><div class="rr">${st?RAR[st][0]:'ZÁROLVA'}</div><b>${z.loot[1]}</b><div class="mut" style="font-size:13px">${z.n}</div></div></div>`}).join('')}
 ${(()=>{const ok=S.tests.some(t=>t.p>=90);return `<div class="loot ${ok?'':'lock'}" style="--r:#ffd23d"><div class="ic">${ok?'👑':'❔'}</div><div><div class="rr">${ok?'MITIKUS':'ZÁROLVA'}</div><b>Nobel-érem</b><div class="mut" style="font-size:13px">Próbadolgozat 90% felett</div></div></div>`})()}</div>`+nav()}

function weak(){return F.filter(f=>!f.soft&&(S.stars[f.z]||0)>=1).map(f=>{const s=S.stats[f.i];return {f,sc:(s?s.o-2*s.b:-.5)+Math.random()*.4}}).sort((a,b)=>a.sc-b.sc)}
function trainScr(){const w=weak();app.innerHTML=header()+`<h2 style="margin:10px 0 4px;font-weight:900">💪 Edzés</h2><p class="mut" style="margin:0 0 14px;line-height:1.5">A játék megjegyzi, mit rontottál el, és azokat kérdezi újra – fejből, gépelve.</p>${w.length?`<button class="btn mg" onclick="startTrain()">GYENGE PONTOK EDZÉSE<small>10 kérdés a már megnyitott pályákból</small></button>`:`<div class="card mut">Előbb teljesíts legalább egy pályát 1 csillagra.</div>`}<div style="height:14px"></div><button class="btn yel" onclick="testIntro()">👑 PRÓBADOLGOZAT<small>28 kérdés, minden fejből, a végén jegy</small></button>`+nav()}

function statsScr(){const w=weak().filter(x=>S.stats[x.f.i]&&S.stats[x.f.i].b>0).slice(0,8);
 const fmt=d=>{const t=new Date(d);return t.getFullYear()+'.'+String(t.getMonth()+1).padStart(2,'0')+'.'+String(t.getDate()).padStart(2,'0')+'. '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')};
 app.innerHTML=header()+`<h2 style="margin:10px 0 12px;font-weight:900">📊 Eredmények</h2><div class="gap">
 <div class="card"><b>Próbadolgozatok</b>${S.tests.length?`<table><tr><th>Mikor</th><th>Eredmény</th><th>Jegy</th></tr>${S.tests.slice().reverse().map(t=>`<tr><td>${fmt(t.d)}</td><td><b>${t.p}%</b></td><td>${t.g}</td></tr>`).join('')}</table>`:`<p class="mut" style="margin:8px 0 0">Még nincs megírt próbadolgozat.</p>`}</div>
 <div class="card"><b>Pályák</b><table>${Z.map(z=>`<tr><td>${z.e} ${z.n}</td><td style="text-align:right">${starsH(S.stars[z.id]||0)}</td></tr>`).join('')}</table></div>
 <div class="card"><b>Amit még gyakorolni kell</b>${w.length?w.map(x=>`<p style="margin:10px 0 0;font-size:15px;line-height:1.4">${x.f.q}<br><b style="color:var(--lime)">${x.f.list?x.f.list.join(', '):x.f.a}</b> <span class="mut">(${S.stats[x.f.i].b}× hibás)</span></p>`).join(''):`<p class="mut" style="margin:8px 0 0">Nincs feljegyzett hiba.</p>`}</div>
 <button class="btn ghost" onclick="S.snd=!S.snd;save();statsScr()">${S.snd?'🔊 Hang: BE':'🔇 Hang: KI'}</button>
 <button class="btn ghost" onclick="if(confirm('Biztosan törlöd az összes eredményt és kezded elölről?')){localStorage.removeItem(KEY);location.reload()}">🗑️ Minden törlése</button></div>`+nav()}

/* ============ JÁTÉKMENET ============ */
let L;
function build(z,star){const fs=sh(F.filter(f=>f.z===z));let qs=[];
 if(star===1)qs=fs.filter(f=>f.w).slice(0,9).map(f=>({f,mode:'mc'}));
 else if(star===2){let t=0;fs.slice(0,11).forEach(f=>qs.push({f,mode:f.list?'list':f.soft?'mc':(t++%2?'mc':'type'),hint:1}))}
 else qs=fs.filter(f=>!f.soft).slice(0,12).map(f=>({f,mode:f.list?'list':'type'}));
 const zo=ZM[z];if(zo.pairs&&star<3)qs.splice(Math.min(4,qs.length),0,{mode:'pair',pairs:sh(zo.pairs).slice(0,4)});
 if(ORDERS[z]&&star>1)qs.splice(3,0,{mode:'order',items:sh(ORDERS[z]).slice(0,4)});
 return qs}
function startRound(z,star){L={kind:'round',z,star,qs:build(z,star),i:0,hearts:3,combo:0,xp:0,done:0};L.total=L.qs.length;renderQ()}
function startTrain(){L={kind:'train',qs:weak().slice(0,10).map(x=>({f:x.f,mode:x.f.list?'list':'type'})),i:0,hearts:99,combo:0,xp:0,done:0};L.total=L.qs.length;renderQ()}
function testIntro(){app.innerHTML=`<div class="gap" style="padding-top:5vh"><div class="big">👑</div><h1 class="ctr" style="font-weight:900">PRÓBADOLGOZAT</h1><div class="card" style="line-height:1.6;font-size:16px">• 28 kérdés az egész anyagból<br>• mindent <b>fejből</b> kell beírni, segítség nincs<br>• közben nem látod, mi jó és mi nem<br>• a végén <b>százalék és jegy</b>, és megnézheted a hibáidat</div><button class="btn yel" onclick="startTest()">INDÍTÁS</button><button class="btn ghost" onclick="go('map')">Vissza</button></div>`;window.scrollTo(0,0)}
function startTest(){const per={z1:4,z2:4,z3:3,z4:4,z5:4,z6:3,z7:3,z8:3};let qs=[];Z.forEach(z=>{qs=qs.concat(sh(F.filter(f=>f.z===z.id&&!f.soft)).slice(0,per[z.id]).map(f=>({f,mode:f.list?'list':'type'})))});
 L={kind:'test',qs,i:0,hearts:99,combo:0,xp:0,done:0,total:qs.length,rec:[]};renderQ()}
function quit(){if(confirm(L.kind==='test'?'Kilépsz? A dolgozat eredménye elvész.':'Kilépsz a körből?'))go('map')}

function renderQ(){const q=L.qs[L.i];let body='';
 const tagTxt={mc:'Válaszd ki',type:'Írd be fejből',list:'Sorold fel',pair:'Párosítsd',order:'Sorrend'}[q.mode];
 if(q.mode==='mc'){q.opts=q.opts||sh([q.f.a].concat(sh(q.f.w).slice(0,3)));body=`<div class="qt">${q.f.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="ansMc(${i})">${o}</button>`).join('')}</div>`}
 else if(q.mode==='type'){const num=q.f.nums&&q.f.nums.length===1;body=`<div class="qt">${q.f.q}</div><input id="inp" class="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${q.f.nums?'szám…':'válasz…'}" onkeydown="if(event.key==='Enter')ansType()">${q.hint&&!q.f.nums?`<button class="hint" id="hb" onclick="hint()">💡 Segítség (fele XP)</button>`:''}<button class="btn" id="chk" onclick="ansType()">ELLENŐRZÉS</button>`}
 else if(q.mode==='list'){const n=q.f.need||q.f.list.length;body=`<div class="qt">${q.f.q}</div>${Array.from({length:n},(_,i)=>`<input class="inp li" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${i+1}." onkeydown="if(event.key==='Enter')liNext(${i})">`).join('')}<button class="btn" id="chk" onclick="ansList()">ELLENŐRZÉS</button>`}
 else if(q.mode==='pair'){q.L=sh(q.pairs.map((p,i)=>i));q.R=sh(q.pairs.map((p,i)=>i));q.sel=null;q.left=q.pairs.length;q.miss=0;body=`<div class="qt">Koppints az összetartozó párokra!</div><div class="pairs">${q.L.map((l,k)=>`<button class="opt" id="pl${l}" onclick="pairTap('l',${l})">${q.pairs[l][0]}</button><button class="opt" id="pr${q.R[k]}" onclick="pairTap('r',${q.R[k]})">${q.pairs[q.R[k]][1]}</button>`).join('')}</div>`}
 else{q.next=0;q.miss=0;q.sorted=q.items.slice().sort((a,b)=>a.s-b.s);body=`<div class="qt">Koppints rájuk a kísérlet sorrendjében! (az első lépéssel kezdd)</div><div class="opts">${q.items.map((d,i)=>`<button class="opt" id="or${i}" onclick="orderTap(${i})">${d.e.charAt(0).toUpperCase()+d.e.slice(1)}</button>`).join('')}</div>`}
 app.innerHTML=`<div class="ltop"><button class="x" onclick="quit()">✕</button><div class="bar" style="flex:1"><i style="width:${Math.round(L.done/L.total*100)}%"></i></div>${L.kind==='round'?`<span class="hearts">${'❤️'.repeat(L.hearts)}${'🖤'.repeat(3-L.hearts)}</span>`:L.kind==='test'?`<span class="pill">${L.i+1}/${L.total}</span>`:''}${L.combo>=3&&L.kind!=='test'?`<span class="combo">🔥x${L.combo}</span>`:''}</div><span class="tag">${tagTxt}</span>${body}`;
 window.scrollTo(0,0);const inp=document.querySelector('.inp');if(inp)setTimeout(()=>inp.focus(),60)}
function hint(){const q=L.qs[L.i];q.hinted=1;document.getElementById('hb').outerHTML=`<p class="mut" style="font-size:18px;letter-spacing:3px;margin:0 0 12px;font-weight:800">${q.f.a.split(' ').map(w=>w[0]+'·'.repeat(w.length-1)).join('  ')}</p>`}
function liNext(i){const a=document.querySelectorAll('.li');if(a[i+1])a[i+1].focus();else ansList()}
function lock(){document.querySelectorAll('.opt,.inp,#chk,#hb').forEach(e=>{e.disabled=true;e.style.pointerEvents='none'})}

function ansMc(i){const q=L.qs[L.i],ok=q.opts[i]===q.f.a,bs=document.querySelectorAll('.opt');lock();bs[i].classList.add(ok?'ok':'no');bs[q.opts.indexOf(q.f.a)].classList.add('ok');stat(q.f.i,ok);settle(ok,10,ok?'':`Helyesen: <b>${q.f.a}</b>`)}
function ansType(){const q=L.qs[L.i],el=document.getElementById('inp'),v=el.value;if(!v.trim()&&L.kind!=='test'){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),300);return}
 const r=check(q.f,v),ok=r!=='no';
 if(L.kind==='test'){L.rec.push({q:q.f.q,g:v,r:q.f.a,p:ok?1:0,m:1,id:q.f.i});stat(q.f.i,ok);L.done++;return next()}
 lock();el.classList.add(ok?'ok':'no');stat(q.f.i,ok);settle(ok,q.hinted?10:20,ok?(r==='typo'?`Kis elírás – pontosan így: <b>${q.f.a}</b>`:''):`Helyesen: <b>${q.f.a}</b>`)}
function ansList(){const q=L.qs[L.i],els=[...document.querySelectorAll('.li')],vals=els.map(e=>e.value),need=q.f.need||q.f.list.length;
 if(vals.every(v=>!v.trim())&&L.kind!=='test'){els[0].classList.add('shake');setTimeout(()=>els[0].classList.remove('shake'),300);return}
 const res=checkList(q.f,vals),hits=res.filter(x=>x>=0).length,ok=hits>=need;
 if(L.kind==='test'){L.rec.push({q:q.f.q,g:vals.filter(v=>v.trim()).join(', '),r:q.f.list.join(', '),p:hits,m:need,id:q.f.i});stat(q.f.i,ok);L.done++;return next()}
 lock();els.forEach((e,k)=>e.classList.add(res[k]>=0?'ok':'no'));stat(q.f.i,ok);settle(ok,30,(ok?'':`${hits}/${need} megvan. `)+`A teljes lista: <b>${q.f.list.join(', ')}</b>`)}
function pairTap(side,i){const q=L.qs[L.i],el=document.getElementById('p'+side+i);
 if(!q.sel||q.sel.side===side){document.querySelectorAll('.opt.sel').forEach(e=>e.classList.remove('sel'));q.sel={side,i};el.classList.add('sel');return}
 const o=document.getElementById('p'+q.sel.side+q.sel.i);o.classList.remove('sel');
 if(q.sel.i===i){[el,o].forEach(e=>e.classList.add('ok','gone'));q.left--;if(S.snd)tone([[740,.07]]);if(!q.left)settle(q.miss===0,15,q.miss?'Volt benne tévesztés – a kör végén visszajön.':'')}
 else{q.miss++;[el,o].forEach(e=>{e.classList.add('no','shake');setTimeout(()=>e.classList.remove('no','shake'),350)});sNo()}
 q.sel=null}
function orderTap(i){const q=L.qs[L.i],el=document.getElementById('or'+i);
 if(q.items[i]===q.sorted[q.next]){q.next++;el.classList.add('ok');el.style.pointerEvents='none';el.innerHTML=`<span class="n">${q.next}</span>${el.textContent} <span class="y">${q.items[i].y}</span>`;if(S.snd)tone([[740,.07]]);
  if(q.next===q.items.length)settle(q.miss===0,15,q.miss?'Volt benne tévesztés – a kör végén visszajön.':'')}
 else{q.miss++;el.classList.add('no','shake');setTimeout(()=>el.classList.remove('no','shake'),350);sNo()}}

function settle(ok,xp,msg){const q=L.qs[L.i];
 if(ok){L.combo++;L.done++;const g=xp+(L.combo>=3?5:0);L.xp+=g;sOk()}
 else{L.combo=0;if(L.kind==='round')L.hearts--;sNo();if(L.hearts>0){const c={mode:q.mode,f:q.f,hint:q.hint,pairs:q.pairs,items:q.items};L.qs.push(c)}}
 const good=['Ez az! 🔥','Szép! 💪','Pontos! 🎯','Megy ez! ⚡','Profi! 👑'];
 const d=document.createElement('div');d.className='fb '+(ok?'ok':'no');d.innerHTML=`<div><h3>${ok?good[Math.floor(Math.random()*good.length)]:'Most nem jött be 😬'}</h3>${msg?`<p>${msg}</p>`:'<p></p>'}<button class="btn ${ok?'lime':'ghost'}" id="nx" onclick="next()">TOVÁBB</button></div>`;
 document.body.appendChild(d);setTimeout(()=>{const b=document.getElementById('nx');if(b)b.focus()},50)}
function next(){document.querySelectorAll('.fb').forEach(e=>e.remove());L.i++;
 if(L.kind==='round'&&L.hearts<=0)return failed();
 if(L.i>=L.qs.length)return L.kind==='test'?testDone():roundDone();
 renderQ()}
function failed(){app.innerHTML=`<div class="gap ctr" style="padding-top:12vh"><div class="big">💔</div><h1 style="font-weight:900">Elfogytak az életek</h1><p class="mut" style="font-size:17px">Semmi gáz. Pörgesd át a kártyákat, és fuss neki újra.</p><button class="btn" onclick="startRound('${L.z}',${L.star})">ÚJRA 🔁</button><button class="btn ghost" onclick="zone('${L.z}');reel('${L.z}',0)">📱 Pörgető</button><button class="btn ghost" onclick="go('map')">Pálya</button></div>`}
function roundDone(){let bonus=0,lootMsg='';const r0=rank();
 if(L.kind==='round'){const z=ZM[L.z],old=S.stars[L.z]||0;if(L.star>old){S.stars[L.z]=L.star;bonus=50*L.star;lootMsg=`<div class="loot" style="--r:${RAR[L.star][1]};text-align:left"><div class="ic">${z.loot[0]}</div><div><div class="rr">${old?'FEJLESZTVE → ':'ÚJ CUCC · '}${RAR[L.star][0]}</div><b>${z.loot[1]}</b></div></div>`}}
 S.xp+=L.xp+bonus;bumpStreak();save();sWin();confetti();
 const up=rank()>r0?`<div class="card" style="border-color:var(--yel)"><b style="color:var(--yel)">RANGLÉPÉS!</b> Új rangod: ${RANKS[rank()][2]} ${RANKS[rank()][1]}</div>`:'';
 const nxt=L.kind==='round'?(L.star<3?`<button class="btn mg" onclick="startRound('${L.z}',${L.star+1})">KÖVETKEZŐ SZINT →</button>`:''):'';
 app.innerHTML=`<div class="gap ctr" style="padding-top:8vh"><div class="big">${L.kind==='round'?'⭐'.repeat(L.star):'💪'}</div><h1 style="font-weight:900">${L.kind==='round'?'Szint teljesítve!':'Edzés kész!'}</h1><div class="row" style="justify-content:center"><span class="pill">+${L.xp+bonus} XP</span><span class="pill">🔥 ${streakNow()} nap</span></div>${lootMsg}${up}${nxt}<button class="btn ${nxt?'ghost':'lime'}" onclick="go('map')">VISSZA A PÁLYÁRA</button></div>`;window.scrollTo(0,0)}
function testDone(){const pts=L.rec.reduce((a,r)=>a+Math.min(r.p,r.m),0),max=L.rec.reduce((a,r)=>a+r.m,0),p=Math.round(pts/max*100),g=p>=90?5:p>=75?4:p>=60?3:p>=40?2:1;
 S.tests.push({d:Date.now(),p,g});S.xp+=p*3;bumpStreak();save();if(p>=75){sWin();confetti(p>=90?70:36)}
 const bad=L.rec.filter(r=>r.p<r.m),d=new Date();
 app.innerHTML=`<div class="gap ctr" style="padding-top:4vh"><div class="card" style="border:2px solid var(--yel)"><div class="mut" style="font-weight:800;letter-spacing:2px;font-size:12px">PRÓBADOLGOZAT · ${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}.</div><div style="font-weight:900;font-size:20px;margin:4px 0">${esc(S.name||'Játékos')}</div><div class="grade">${g}</div><div style="font-size:26px;font-weight:900">${p}%</div><div class="mut">${pts} / ${max} pont · becsült jegy</div>${p===100?'<p style="font-weight:900;color:var(--lime);margin:10px 0 0">HIBÁTLAN! Mutasd meg apának és anyának! 📸</p>':p>=90?'<p style="font-weight:800;color:var(--lime);margin:10px 0 0">Megvan a Nobel-érem! 🏅</p>':''}</div>
 <span class="pill" style="align-self:center">+${p*3} XP</span>
 ${bad.length?`<h3 style="text-align:left;margin-top:8px">Ezeket nézd át (${bad.length}):</h3>${bad.map(r=>`<div class="rev" style="text-align:left">${r.q}<br><span class="mut">Te: ${r.g.trim()?esc(r.g):'–'}</span><br><b>${r.r}</b></div>`).join('')}`:''}
 ${bad.length?'<button class="btn mg" onclick="startTrain()">💪 HIBÁK GYAKORLÁSA</button>':''}<button class="btn yel" onclick="startTest()">ÚJ DOLGOZAT 🔁</button><button class="btn ghost" onclick="go('map')">VISSZA A PÁLYÁRA</button></div>`;window.scrollTo(0,0)}

home();
</script>
